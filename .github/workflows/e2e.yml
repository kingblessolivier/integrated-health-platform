name: e2e

on:
  push:
    paths: ["backend/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/e2e.yml"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: inhp
          POSTGRES_USER: inhp
          # trust auth for the ephemeral CI database — no password literal to manage
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inhp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: inhp
      POSTGRES_USER: inhp
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]"
      - name: Apply schema
        run: psql -h localhost -U inhp -d inhp -f sql/0001_initial.sql
      - name: Run data-layer e2e
        run: python -m e2e.run_slice
