# Local development stack. Postgres uses the TimescaleDB+PostGIS-capable image so the
# canonical schema (backend/sql/0001_initial.sql) applies cleanly.
# Credentials come from the environment / .env (copy .env.example -> .env). No secrets here.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inhp}
      POSTGRES_USER: ${POSTGRES_USER:-inhp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/sql/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-inhp}
      POSTGRES_USER: ${POSTGRES_USER:-inhp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-secret}
    depends_on: [db, redis]
    ports: ["8000:8000"]

volumes:
  dbdata:
