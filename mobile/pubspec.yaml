name: inhp_mobile
description: Integrated National Health Platform — offline-first mobile (CHW / patient / ambulance)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.18.0          # SQLite op-log + cached records
  sqlite3_flutter_libs: ^0.5.0
  hive: ^2.2.3            # iCCM decision tables, lightweight KV
  http: ^1.2.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
