name: inhp_mobile
description: Integrated National Health Platform — offline-first mobile (CHW / patient / ambulance)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

# Phase 2 dependencies (added when the offline data layer is implemented — see docs/51):
#   drift, sqlite3_flutter_libs   # SQLite op-log + cached records
#   hive                          # iCCM decision tables, lightweight KV
#   http                          # API client
#   connectivity_plus             # reconnect-triggered sync

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
